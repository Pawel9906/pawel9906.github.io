<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Królewskie Kaczki 3</title>
  <style>
    body { margin: 0; padding: 50px; background: #222; overflow: hidden; }
    canvas { background: #87CEEB; display: block; margin: 0 auto; border: 2px solid #444; }
    #restartBtn {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 22px;
      background: #ffcc00;
      border: 3px solid #333;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="900" height="500"></canvas>
<button id="restartBtn">Jeszcze raz</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restartBtn');

const GRAVITY = 0.5;
const FLOOR = 450;
const WORLD_WIDTH = 6000;

let keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

/* KAMERA */
let camera = {
  x: 0,
  follow(target) {
    this.x = target.x - canvas.width * 0.4;
    if (this.x < 0) this.x = 0;
    if (this.x > WORLD_WIDTH - canvas.width) this.x = WORLD_WIDTH - canvas.width;
  }
};

/* ANIMACJA SKRZYDEŁ */
let wingFrame = 0;

/* RYSOWANIE KACZKI */
function drawDuck(x, y, w, h, isAttacking, facingRight, vx) {
  const screenX = x - camera.x;

  let wingOffset = Math.sin(wingFrame / 5) * 8;
  if (Math.abs(vx) < 0.2) wingOffset = 0;
  if (isAttacking) wingOffset = 15;

  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.ellipse(screenX + w/2, y - h/2, w/2, h/2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "orange";
  ctx.beginPath();
  ctx.ellipse(
    screenX + w/2 + (facingRight ? -10 : 10),
    y - h/2,
    12, 20 + wingOffset, 0, 0, Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.ellipse(screenX + w/2, y - h - 10, w/3, h/3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(screenX + w/2 + (facingRight ? 8 : -8), y - h - 15, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "orange";
  ctx.beginPath();
  ctx.ellipse(
    screenX + w/2 + (facingRight ? 15 : -15),
    y - h - 10,
    12, 6, 0, 0, Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "gray";
  ctx.beginPath();
  ctx.arc(screenX + w/2, y - h - 20, 20, Math.PI, 0);
  ctx.fill();

  if (isAttacking) {
    ctx.fillStyle = "rgba(255,255,0,0.6)";
    ctx.beginPath();
    if (facingRight) {
      ctx.arc(screenX + w + 10, y - h/2, 25, Math.PI * 1.5, Math.PI * 0.5);
    } else {
      ctx.arc(screenX - 10, y - h/2, 25, Math.PI * 0.5, Math.PI * 1.5);
    }
    ctx.fill();
  }
}

/* PROSTE LISY */
function drawFoxSimple(screenX, y, w, h) {
  ctx.fillStyle = "#e86b1f";
  ctx.fillRect(screenX, y - h/2, w, h/2);

  ctx.fillRect(screenX + w - 20, y - h + 5, 20, 20);

  ctx.fillStyle = "#2b1b12";
  ctx.fillRect(screenX + w - 18, y - h + 2, 6, 6);
  ctx.fillRect(screenX + w - 8, y - h + 2, 6, 6);

  ctx.fillStyle = "white";
  ctx.fillRect(screenX + w - 15, y - h + 10, 6, 4);

  ctx.fillStyle = "black";
  ctx.fillRect(screenX + w - 13, y - h + 11, 3, 3);

  ctx.fillStyle = "#e86b1f";
  ctx.fillRect(screenX - 15, y - h/2 + 5, 15, 10);
  ctx.fillStyle = "white";
  ctx.fillRect(screenX - 5, y - h/2 + 5, 5, 10);
}

/* KACZKA */
class Duck {
  constructor() {
    this.x = 100;
    this.y = FLOOR;
    this.width = 40;
    this.height = 40;
    this.vx = 0;
    this.vy = 0;
    this.speed = 0.5;
    this.maxSpeed = 4;
    this.friction = 0.85;
    this.jumpPower = -10;

    this.onGround = true;
    this.jumpCount = 0;
    this.jumpPressed = false;

    this.isAttacking = false;
    this.attackCooldown = 0;
    this.attackDelay = 120;
    this.facingRight = true;
  }

  update() {
    if (keys['ArrowRight'] || keys['KeyD']) {
      this.vx += this.speed;
      this.facingRight = true;
    }
    if (keys['ArrowLeft'] || keys['KeyA']) {
      this.vx -= this.speed;
      this.facingRight = false;
    }

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW'])) {
      if (!this.jumpPressed) {
        this.jumpPressed = true;

        if (this.onGround) {
          this.vy = this.jumpPower;
          this.onGround = false;
          this.jumpCount = 1;
        } else if (this.jumpCount === 1) {
          this.vy = this.jumpPower;
          this.jumpCount = 2;
        }
      }
    } else {
      this.jumpPressed = false;
    }

    if (keys['KeyJ'] && this.attackCooldown <= 0) {
      this.isAttacking = true;
      this.attackCooldown = this.attackDelay;
    }

    if (this.attackCooldown > 0) {
      this.attackCooldown--;
      if (this.attackCooldown < this.attackDelay - 10) {
        this.isAttacking = false;
      }
    }

    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;

    this.vx *= this.friction;

    if (this.y >= FLOOR) {
      this.y = FLOOR;
      this.vy = 0;
      this.onGround = true;
      this.jumpCount = 0;
    }

    if (this.x < 0) this.x = 0;
    if (this.x > WORLD_WIDTH - this.width) this.x = WORLD_WIDTH - this.width;
  }

  draw() {
    drawDuck(this.x, this.y, this.width, this.height, this.isAttacking, this.facingRight, this.vx);
  }
}

/* MONETA */
class Coin {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.collected = false;
  }

  draw() {
    const screenX = this.x - camera.x;
    if (!this.collected) {
      ctx.beginPath();
      ctx.arc(screenX, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'gold';
      ctx.fill();
    }
  }

  checkCollision(duck) {
    const dx = duck.x + duck.width / 2 - this.x;
    const dy = duck.y - duck.height / 2 - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < this.radius + duck.width / 2) {
      this.collected = true;
      score += 1;
    }
  }
}

/* LIS */
class Fox {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.width = 50;
    this.height = 40;

    this.vx = (Math.random() < 0.5 ? -1 : 1) * 2;
    this.vy = 0;

    this.onGround = false;
    this.dead = false;

    this.jumpPower = -9;
  }

  update(platforms) {
    if (this.dead) return;

    this.x += this.vx;

    if (this.x < 0 || this.x + this.width > WORLD_WIDTH) {
      this.vx *= -1;
    }

    this.vy += GRAVITY;
    this.y += this.vy;

    if (this.y >= FLOOR) {
      this.y = FLOOR;
      this.vy = 0;
      this.onGround = true;
    }

    this.onGround = false;
    for (let p of platforms) {
      const isAbove =
        this.x + this.width > p.x &&
        this.x < p.x + p.width &&
        this.y + this.vy >= p.y &&
        this.y + this.vy <= p.y + p.height &&
        this.vy > 0;

      if (isAbove) {
        this.y = p.y;
        this.vy = 0;
        this.onGround = true;
      }
    }

    if (this.onGround && Math.random() < 0.01) {
      this.vy = this.jumpPower;
      this.onGround = false;
    }
  }

  draw() {
    if (!this.dead) {
      const screenX = this.x - camera.x;
      drawFoxSimple(screenX, this.y, this.width, this.height);
    }
  }

  checkCollision(duck) {
    if (this.dead) return;

    if (duck.isAttacking) {
      const attackRange = 50;
      const inRange =
        duck.facingRight
          ? this.x < duck.x + duck.width + attackRange && this.x + this.width > duck.x
          : this.x + this.width > duck.x - attackRange && this.x < duck.x + duck.width;

      if (inRange && Math.abs(this.y - duck.y) < 40) {
        this.dead = true;
        return;
      }
    }

    if (
      duck.x < this.x + this.width &&
      duck.x + duck.width > this.x &&
      duck.y < this.y &&
      duck.y + duck.height > this.y - this.height
    ) {
      gameOver = true;
      restartBtn.style.display = "block";
    }
  }
}

/* PLATFORMY */
class Platform {
  constructor(x, y, width) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = 15;
  }

  draw() {
    const screenX = this.x - camera.x;
    ctx.fillStyle = '#654321';
    ctx.fillRect(screenX, this.y, this.width, this.height);
  }

  checkLanding(duck) {
    if (
      duck.x + duck.width > this.x &&
      duck.x < this.x + this.width &&
      duck.y + duck.vy >= this.y &&
      duck.y + duck.vy <= this.y + this.height &&
      duck.vy > 0
    ) {
      duck.y = this.y;
      duck.vy = 0;
      duck.onGround = true;
      duck.jumpCount = 0;
    }
  }
}

/* RESET GRY */
function resetGame() {
  duck = new Duck();
  score = 0;
  gameOver = false;
  camera.x = 0;

  coins = generateCoins();
  foxes = generateFoxes();
  platforms = generatePlatforms();

  restartBtn.style.display = "none";
}

restartBtn.addEventListener("click", resetGame);

/* GENEROWANIE OBIEKTÓW */
function generateCoins() {
  let arr = [];
  for (let i = 0; i < 60; i++) {
    arr.push(new Coin(
      200 + Math.random() * (WORLD_WIDTH - 400),
      150 + Math.random() * 250
    ));
  }
  return arr;
}

function generateFoxes() {
  let arr = [];
  const count = 12 + Math.floor(Math.random() * 6);
  for (let i = 0; i < count; i++) {
    arr.push(new Fox(
      300 + Math.random() * (WORLD_WIDTH - 600),
      FLOOR
    ));
  }
  return arr;
}

/* NOWE GENEROWANIE PLATFORM */
function generatePlatforms() {
  let arr = [
    new Platform(200, 380, 120),
    new Platform(450, 330, 150),
    new Platform(700, 300, 120),
    new Platform(1000, 350, 150),
    new Platform(1300, 280, 120),
    new Platform(1600, 240, 150),
    new Platform(2000, 300, 120),
    new Platform(2400, 350, 150),
    new Platform(2800, 260, 120),
    new Platform(3200, 200, 150),
    new Platform(3600, 300, 120),
    new Platform(4000, 350, 150),
    new Platform(4500, 280, 150),
    new Platform(5000, 320, 150)
  ];

  // średnie platformy (200–400)
  for (let i = 0; i < 35; i++) {
    const x = 300 + Math.random() * (WORLD_WIDTH - 600);
    const y = 200 + Math.random() * 200;
    const w = 80 + Math.random() * 150;
    arr.push(new Platform(x, y, w));
  }

  // wysokie platformy (50–150)
  for (let i = 0; i < 25; i++) {
    const x = 300 + Math.random() * (WORLD_WIDTH - 600);
    const y = 50 + Math.random() * 100;
    const w = 60 + Math.random() * 120;
    arr.push(new Platform(x, y, w));
  }

  // bardzo wysokie platformy (20–60)
  for (let i = 0; i < 10; i++) {
    const x = 300 + Math.random() * (WORLD_WIDTH - 600);
    const y = 20 + Math.random() * 40;
    const w = 80 + Math.random() * 100;
    arr.push(new Platform(x, y, w));
  }

  return arr;
}

/* OBIEKTY STARTOWE */
let duck = new Duck();
let score = 0;
let gameOver = false;

let coins = generateCoins();
let foxes = generateFoxes();
let platforms = generatePlatforms();

/* HUD */
function drawHUD() {
  ctx.fillStyle = 'black';
  ctx.font = '20px Arial';
  ctx.fillText(`Monety: ${score}`, 20, 30);

  ctx.fillStyle = "red";
  ctx.fillRect(20, 50, 120, 10);
  ctx.fillStyle = "lime";
  const cd = (duck.attackDelay - duck.attackCooldown) / duck.attackDelay;
  ctx.fillRect(20, 50, 120 * cd, 10);
}

/* PĘTLA GRY */
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!gameOver) {
    duck.update();
    camera.follow(duck);

    platforms.forEach(p => p.checkLanding(duck));

    duck.draw();
    platforms.forEach(p => p.draw());

    coins.forEach(c => {
      c.draw();
      c.checkCollision(duck);
    });

    foxes.forEach(f => {
      f.update(platforms);
      f.draw();
      f.checkCollision(duck);
    });

    drawHUD();
  } else {
    ctx.fillStyle = 'black';
    ctx.font = '40px Arial';
    ctx.fillText('Koniec gry!', canvas.width / 2 - 100, canvas.height / 2);
  }

  wingFrame++;
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
