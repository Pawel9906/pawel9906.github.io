<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Worms 2D – kamera + duży świat</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #000;
      background: #87cefa;
    }
  </style>
</head>
<body>
  <canvas id="game" width="900" height="500"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // --- PARAMETRY ŚWIATA ---
    const WORLD_WIDTH = 3000;   // szerokość świata
    const WORLD_HEIGHT = canvas.height;

    // --- KAMERA ---
    let cameraX = 0;

    // --- ŁADOWANIE GRAFIKI WORMA ---
    const wormImg = new Image();
    wormImg.src = "https://pngimg.com/uploads/worms_game/worms_game_PNG11.png";

    // --- GENERATOR TERENU ---
    function generateTerrain(width, height) {
      const terrain = [];
      let y = height * 0.6;
      let dy = 0;

      for (let x = 0; x < width; x++) {
        dy += (Math.random() - 0.5) * 0.15;
        dy *= 0.98;
        y += dy;

        y = Math.max(height * 0.25, Math.min(height * 0.9, y));
        terrain[x] = y;
      }

      for (let i = 2; i < width - 2; i++) {
        terrain[i] = (
          terrain[i - 2] +
          terrain[i - 1] +
          terrain[i] +
          terrain[i + 1] +
          terrain[i + 2]
        ) / 5;
      }

      return terrain;
    }

    const terrain = generateTerrain(WORLD_WIDTH, WORLD_HEIGHT);

    // --- GRACZ ---
    const player = {
      x: 200,
      y: 100,
      w: 40,
      h: 40,
      vx: 0,
      vy: 0,
      speed: 3.2,
      jump: 7,
      onGround: false,
      facing: 1,
      jumps: 0,
      maxJumps: 2,
      canFlip: true
    };

    const keys = { left: false, right: false, up: false };
    let jumpPressed = false;
    let flipPressed = false;

    // --- STEROWANIE ---
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;

      if (e.key === "ArrowUp" || e.key === "Enter") {
        if (!keys.up) jumpPressed = true;
        keys.up = true;
      }

      if (e.key === "Backspace") {
        flipPressed = true;
      }
    });

    window.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
      if (e.key === "ArrowUp" || e.key === "Enter") keys.up = false;
    });

    const gravity = 0.35;
    const friction = 0.8;

    // --- LOGIKA GRY ---
    function update() {

      // ruch poziomy
      if (keys.left) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx *= friction;
      }

      // --- PODWÓJNY SKOK ---
      if (jumpPressed) {
        if (player.onGround) {
          player.vy = -player.jump;
          player.onGround = false;
          player.jumps = 1;
          player.canFlip = true;
        } else if (player.jumps < player.maxJumps) {
          player.vy = -player.jump;
          player.jumps++;
        }
      }
      jumpPressed = false;

      // --- SALTO ---
      if (flipPressed && !player.onGround && player.canFlip) {
        player.vy = -player.jump * 1.4;
        player.vx = -player.facing * 1.2;
        player.canFlip = false;
      }
      flipPressed = false;

      // grawitacja
      player.vy += gravity;

      // aktualizacja pozycji
      player.x += player.vx;
      player.y += player.vy;

      // ograniczenia świata
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

      // kolizja z terenem
      const px = Math.floor(player.x + player.w / 2);
      const groundY = terrain[px];

      if (player.y + player.h > groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumps = 0;
        player.canFlip = true;
      }

      // --- KAMERA ŚLEDZI ROBAKA ---
      cameraX = player.x - canvas.width / 2;

      // ograniczenia kamery
      if (cameraX < 0) cameraX = 0;
      if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
    }

    // --- RYSOWANIE ---
    function drawTerrain() {
      ctx.fillStyle = "#3b2f1b";
      ctx.beginPath();
      ctx.moveTo(0 - cameraX, canvas.height);

      for (let x = 0; x < WORLD_WIDTH; x++) {
        ctx.lineTo(x - cameraX, terrain[x]);
      }

      ctx.lineTo(WORLD_WIDTH - cameraX, canvas.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawPlayer() {
      if (!wormImg.complete) return;

      ctx.save();

      const drawX = player.x - cameraX;

      if (player.facing !== 1) {
        ctx.drawImage(wormImg, drawX, player.y, player.w, player.h);
      } else {
        ctx.translate(drawX + player.w, player.y);
        ctx.scale(-1, 1);
        ctx.drawImage(wormImg, 0, 0, player.w, player.h);
      }

      ctx.restore();
    }

    function loop() {
      update();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawTerrain();
      drawPlayer();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
